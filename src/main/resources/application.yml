spring:
  datasource:
    # Every value here can be overridden with an environment variable, so the repository never
    # needs to carry a real password. The defaults are the local development ones.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Keep user settings, including each user's Canvas token, between restarts.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database:  postgresql

server:
  port: ${SERVER_PORT:8081}
  # Was under spring.web.error, which is not a real property, so the "message" field was
  # always blank and the frontend could never show why a Canvas sync failed.
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
jwt:
  # Development default. Set JWT_SECRET to something private before running this anywhere real —
  # anyone holding this string can mint a token for any account.
  secret: ${JWT_SECRET:jira-app-super-secret-key-must-be-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

spring.mail:
  # OTP login emails are sent through this SMTP account. Nothing here is real — set MAIL_HOST,
  # MAIL_USERNAME and MAIL_PASSWORD (and MAIL_PORT if not 587) before OTP emails can actually send.
  host: ${MAIL_HOST:smtp.example.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# The address OTP emails are sent from. Without this Spring Mail falls back to the SMTP login
# (e.g. an @smtp-brevo.com relay address), which is not a verified sender and Gmail/Yahoo/
# Microsoft silently drop mail from it under their current DKIM/DMARC requirements. Must be a
# sender verified with the SMTP provider (Brevo: Settings > Senders, Domains & Dedicated IPs).
mail:
  from: ${MAIL_FROM:${MAIL_USERNAME:noreply@example.com}}
