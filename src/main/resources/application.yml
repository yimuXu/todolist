spring:
  datasource:
    # Every value here can be overridden with an environment variable, so the repository never
    # needs to carry a real password. The defaults are the local development ones.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Keep user settings, including each user's Canvas token, between restarts.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database:  postgresql

server:
  port: ${SERVER_PORT:8081}
  # Was under spring.web.error, which is not a real property, so the "message" field was
  # always blank and the frontend could never show why a Canvas sync failed.
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
jwt:
  # Development default. Set JWT_SECRET to something private before running this anywhere real —
  # anyone holding this string can mint a token for any account.
  secret: ${JWT_SECRET:jira-app-super-secret-key-must-be-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

# OTP mail goes through Brevo's HTTPS transactional API, not SMTP — several hosts (Render's
# free tier included) throttle or block outbound SMTP as an anti-abuse measure, which left
# signup hanging indefinitely rather than failing. HTTPS uses the same outbound path as every
# other external call this app makes (Canvas included).
mail:
  # Must be a sender verified with Brevo (Settings > Senders, Domains & Dedicated IPs > Senders)
  # or Gmail/Yahoo/Microsoft silently drop the mail under their DKIM/DMARC requirements.
  from: ${MAIL_FROM:noreply@example.com}

brevo:
  # Settings > SMTP & API > API Keys in the Brevo dashboard. Different from the SMTP login/key.
  api-key: ${BREVO_API_KEY:}
